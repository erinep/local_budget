<div class="card" id="widget-category-trends"
     hx-get="{{ url_for('intelligence.widget', key='category_trends') }}"
     hx-trigger="none"
     hx-target="#widget-category-trends"
     hx-swap="outerHTML">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3);">
        <h2 style="font-size: var(--text-lg); margin: 0;">{{ category_trends.title }}</h2>
        <label class="ct-total-toggle">
            <input type="checkbox" id="ct-total-checkbox" checked>
            <span>Show total</span>
        </label>
    </div>

    <div class="ct-pills" style="display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4);">
        <button class="ct-pill ct-pill--all ct-pill--active" id="ct-pill-all">All</button>
        {% for ds in category_trends.datasets %}
        <button class="ct-pill" data-index="{{ loop.index0 }}">{{ ds.label }}</button>
        {% endfor %}
    </div>

    <div class="chart-host" style="min-height: 280px;">
        <canvas id="chart-category-trends"
                data-chart='{{ category_trends_chart | tojson }}'></canvas>
    </div>
    <p style="margin: var(--space-3) 0 0; font-size: var(--text-sm); color: var(--muted);">
        Last {{ category_trends.period_months }} complete months &middot; active accounts only
    </p>
</div>
