<div class="card" id="widget-category-totals"
     hx-get="{{ url_for('intelligence.widget', key='category_totals') }}"
     hx-trigger="none"
     hx-target="#widget-category-totals"
     hx-swap="outerHTML">
    <h2 class="card-title">{{ category_totals.title }}</h2>
    <p class="widget-subtitle">
        Last {{ category_totals.period_months }} complete months &middot; select one or more categories to compare their top transactions by value
    </p>

    <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4);">
        <button id="ctot-pill-all" class="ct-pill ct-pill--all ct-pill--active">All</button>
        {% for item in category_totals.items %}
        <button class="ctot-pill ct-pill"
                data-index="{{ loop.index0 }}"
                data-label="{{ item.label }}"
                {% if item.is_uncategorized %}data-uncategorized="1"{% endif %}>
            {{ item.label }}
        </button>
        {% endfor %}
    </div>

    <div class="chart-host" style="min-height: 280px;">
        <canvas id="chart-category-totals"
                data-chart='{{ category_totals_chart | tojson }}'></canvas>
    </div>
</div>
