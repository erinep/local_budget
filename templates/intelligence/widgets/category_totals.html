<div class="card" id="widget-category-totals"
     hx-get="{{ url_for('intelligence.widget', key='category_totals') }}"
     hx-trigger="none"
     hx-target="#widget-category-totals"
     hx-swap="outerHTML">
    <h2 style="font-size: var(--text-lg); margin: 0 0 var(--space-4);">{{ category_totals.title }}</h2>
    <div class="chart-host" style="min-height: 280px;">
        <canvas id="chart-category-totals"
                data-chart='{{ category_totals_chart | tojson }}'></canvas>
    </div>
    <p style="margin: var(--space-3) 0 0; font-size: var(--text-sm); color: var(--muted);">
        Last {{ category_totals.period_months }} complete months &middot; active accounts only
    </p>
</div>
