{% extends "settings/layout.html" %}
{% block settings_title %}Profile{% endblock %}

{% block settings_content %}
<h1 class="page-title" style="margin-bottom: 24px;">Profile</h1>

<div class="card" style="margin-bottom: 16px;">
    <h2 style="margin: 0 0 12px; font-size: 1.1rem;">Signed in as</h2>
    <p style="font-weight: 600; margin: 0 0 20px;">{{ g.user.email }}</p>
    <a class="button-secondary" href="{{ url_for('auth.logout') }}">Sign out</a>
</div>

<div class="card" style="text-align: center; padding: 28px 24px;">
    <p style="color: var(--muted); margin: 0 0 6px; font-weight: 700;">More coming soon.</p>
    <p style="color: var(--muted); margin: 0; font-size: 0.92rem;">
        Email change and display name management will land in a future update.
    </p>
</div>
{% endblock %}
